name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fetch Suisse Intl from R2
        run: pnpm fonts
        env:
          FONT_BUCKET_URL: ${{ secrets.FONT_BUCKET_URL }}
      - name: Build and deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        env:
          # Public OpenPanel project id; unset means the site ships without analytics.
          VITE_OPENPANEL_CLIENT_ID: ${{ vars.OPENPANEL_CLIENT_ID }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          preCommands: pnpm build
