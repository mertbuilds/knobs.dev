procs:
  web:
    # https://knobs.localhost
    shell: pnpm exec portless knobs pnpm --filter @knobs/web dev
  storybook:
    # https://storybook.knobs.localhost — storybook respects --port only, so pass PORT through.
    shell: pnpm exec portless storybook.knobs sh -c 'pnpm --filter @knobs/ui exec storybook dev --port "$PORT" --no-open'
